services:
  # Backend Web Service
  - type: web
    name: documind-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        value: "sqlite:////data/documind.db"
      - key: QDRANT_PATH
        value: "/data/qdrant_data"
      - key: UPLOAD_DIR
        value: "/data/uploads"
    disk:
      name: documind-data
      mountPath: /data
      sizeGB: 1

  # Frontend Web Service
  - type: web
    name: documind
    env: node
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm run start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: documind-backend
          envVarKey: RENDER_EXTERNAL_URL

